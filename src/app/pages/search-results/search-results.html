<div class="list-container">
  @if (isSearching()) {
    <app-loading-state message="Buscando artículos..." />
  } @else if(results() && results().length > 0){
  <mat-list>
    <app-back-button routerLink="/home" />

    <div mat-subheader class="mat-title-large">
      Resultados de la búsqueda de {{query()}}
    </div>
    <mat-divider></mat-divider>
    @for (article of results(); track article) {
    <a
      mat-list-item
      role="link"
      [routerLink]="['/posts', article.id]"
      (click)="beforeNavigate()"
    >
      <mat-icon class="list-icon" matListItemIcon>article</mat-icon>
      <div matListItemTitle class="list-title">{{article.title}}</div>
      <div matListItemLine class="list-content">
        {{article.content | pipeMarkdown}}
      </div>
    </a>
    <mat-divider></mat-divider>
    }
  </mat-list>
  @if(count() == results().length){<button
    matButton="elevated"
    (click)="loadMore()"
  >
    Ver más</button
  >}
  } @else {
    <app-empty-state
      icon="search_off"
      title="Pruebe con otras palabras clave o revise la ortografía"
      message="No encontramos resultados de ayuda para esta búsqueda"
      [action]="{label: 'Volver al inicio', route: '/home'}">
    </app-empty-state>
  }
</div>

<app-support-box />
