<mat-card class="example-card-content">
  <a mat-card [href]="ctaHref" class="card-link">
    <mat-card-header style="padding: 16px">
      <div mat-card-avatar [style.--imgUrl]="ctaUrl" class="example-header-image"></div>
      <mat-card-title
        style="
          font-size: 1rem;
          font-weight: 500;
          letter-spacing: 0rem;
          line-height: 1.5rem;
          margin: 0;
        "
        >{{ ctaTitle || 'Contactar a un asesor de Redif' }}</mat-card-title
      >
      <mat-card-subtitle
        style="font-size: 0.875rem; font-weight: 400; line-height: 1.5rem"
        >{{ ctaSubtitle || 'Obten respuesta de nuestro equipo de soporte'
        }}</mat-card-subtitle
      >
    </mat-card-header></a
  >
</mat-card>
