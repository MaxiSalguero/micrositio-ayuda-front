<section class="header-page">
  <h2 class="mat-headline-large">¿En que podemos ayudarte?</h2>

  <form [formGroup]="formularioBusqueda" (ngSubmit)="send()">
    <mat-form-field appearance="outline">
      <mat-label>Buscar</mat-label>
      <input
        matInput
        placeholder="Describe tu problema"
        name="busqueda"
        formControlName="busqueda"
      />
      <button
        mat-icon-button
        matSuffix
        aria-label="Buscar"
        type="submit"
        [routerLink]="['/search']"
        [queryParams]="{q: formularioBusqueda.value.busqueda}"
      >
        <mat-icon>search</mat-icon>
      </button>
    </mat-form-field>
  </form>
</section>

<section class="category_section">
  <p>
    Para empezar, selecciona tu rol y descubre la información que mejor se
    adapta a ti
  </p>

  <div class="category_buttons">
    <button
      matButton="filled"
      class="role_button"
      (click)="handleParent('Alumnos')"
    >
      Soy Alumno
    </button>
    <button
      matButton="filled"
      class="role_button"
      (click)="handleParent('Profesores')"
    >
      Soy Profesor
    </button>
    <button
      matButton="filled"
      class="role_button"
      (click)="handleParent('Administración')"
    >
      Soy Administrador
    </button>
  </div>
</section>

<mat-card class="example-card" appearance="outlined">
  <mat-card-header style="justify-content: center">
    <mat-card-title>¿Necesitas más ayuda?</mat-card-title>
    <mat-card-subtitle
      style="
        font-size: 0.875rem;
        text-align: center;
        font-weight: 400;
        line-height: 1.25rem;
      "
      >Prueba estos próximos pasos:</mat-card-subtitle
    >
  </mat-card-header>

  <mat-card-content>
    <mat-card class="example-card-content">
      <a mat-card href="#" class="card-link">
        <mat-card-header style="padding: 16px">
          <div mat-card-avatar class="example-header-image"></div>
          <mat-card-title
            style="
              font-size: 1rem;
              font-weight: 500;
              letter-spacing: 0rem;
              line-height: 1.5rem;
              margin: 0;
            "
            >Contactar a un asesor de Redif</mat-card-title
          >
          <mat-card-subtitle
            style="font-size: 0.875rem; font-weight: 400; line-height: 1.5rem"
            >Obten respuesta de nuestro equipo de soporte</mat-card-subtitle
          >
        </mat-card-header></a
      >
    </mat-card>
  </mat-card-content>
</mat-card>
