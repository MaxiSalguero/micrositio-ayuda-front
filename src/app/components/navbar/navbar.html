<div class="example-container">
  <mat-sidenav-container class="example-sidenav-container">
    <mat-sidenav #snav [mode]="'over'" class="custom-sidenav">
      <div class="sidenav-header">
        <span class="sidenav-title">Redif Help</span>
        <button mat-icon-button (click)="snav.toggle()">
          <mat-icon>close</mat-icon>
        </button>
      </div>

      <div class="sidenav-content">
        <!-- Elementos principales del menú -->
        <div class="sidenav-main-menu">
          <mat-nav-list>
            <a mat-list-item href="//classroom.google.com/">
              <mat-icon matListItemIcon>launch</mat-icon>
              <span matListItemTitle>Redif App</span>
            </a>
            <a mat-list-item href="/edu/classroom/community?hl=en">
              <mat-icon matListItemIcon>group</mat-icon>
              <span matListItemTitle>Comunidad</span>
            </a>
          </mat-nav-list>
        </div>

        <!-- Elementos del footer/bottom -->
        <div class="sidenav-footer-menu">
          <mat-divider></mat-divider>
          <mat-nav-list>
            <a mat-list-item href="//www.google.com/intl/en/privacy.html">
              <span matListItemTitle>Política de privacidad</span>
            </a>
            <a mat-list-item href="https://www.google.com/accounts/TOS">
              <span matListItemTitle>Condiciones del servicio</span>
            </a>
            <a mat-list-item>
              <span matListItemTitle>Enviar comentarios</span>
            </a>
          </mat-nav-list>
        </div>
      </div>
    </mat-sidenav>

    <mat-sidenav-content>
      <mat-toolbar color="primary" class="navbar-toolbar">
        <button matIconButton (click)="snav.toggle()">
          <mat-icon>menu</mat-icon>
        </button>
        <span class="navbar-title"
          ><a href="/home" class="footer__link">Sitio de Ayuda</a></span
        >
        <span class="spacer"></span>
        <span class="navbar-brand"
          >Redif<img src="images/redif_ar_logo.jpeg" alt="logo"
        /></span>
      </mat-toolbar>

      <main class="main-content">
        <router-outlet></router-outlet>
      </main>

      <app-footer></app-footer>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
