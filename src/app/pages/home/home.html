<div style="display: flex; flex-direction: column; align-items: center;">

<app-page-header [showBackButton]="false" title="¿Qué estás buscando?" />

<app-search-bar />

</div>

<section class="category-section">
  <p>
    Para empezar, selecciona tu rol y descubre la información que mejor se
    adapta a ti
  </p>

  @if (isLoading()) {
    <div class="loading-state">
      <p>Cargando categorías...</p>
    </div>
  } @else {
    <div class="category-buttons">
      @for (category of rootCategories(); track category.id) {
        <button
          matButton="filled"
          class="role-button"
          (click)="handleCategoryClick(category)"
        >
          {{ category.title }}
        </button>
      }
    </div>
  }
</section>

<app-support-box />
