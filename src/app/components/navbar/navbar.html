<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #drawer class="sidenav" mode="over">
    <mat-nav-list>
      <a
        mat-list-item
        routerLink=""
        routerLinkActive="active"
        [routerLinkActiveOptions]="{exact: true}"
        >Home</a
      >
    </mat-nav-list>
  </mat-sidenav> <!-- No esta funcionando deberia dibujar un flotante con las opciones al clickear menu hamburguesa -->

  <mat-toolbar color="primary" class="mat-elevation-z4">
    <button mat-icon-button (click)="drawer.toggle()">
      <mat-icon>menu</mat-icon>
    </button>
    <span class="navbar-title">Sitio de Ayuda</span>
    <span class="spacer"></span>
    <span class="navbar-brand">Redif<img src="images/redif_ar_logo.jpeg" alt="logo"></span>
  </mat-toolbar>
</mat-sidenav-container>
