<section class="header-page">
  <h2 class="mat-headline-large">¿Qué estás buscando?</h2>

  <form [formGroup]="formularioBusqueda" (ngSubmit)="send()">
    <mat-form-field appearance="outline">
      <mat-label>Buscar</mat-label>
      <input
        matInput
        placeholder="Describe tu problema"
        name="busqueda"
        formControlName="busqueda"
      />
      <button
        mat-icon-button
        matSuffix
        aria-label="Buscar"
        type="submit"
        [routerLink]="['/search']"
        [queryParams]="{q: formularioBusqueda.value.busqueda}"
      >
        <mat-icon>search</mat-icon>
      </button>
    </mat-form-field>
  </form>
</section>

<section class="category_section">
  <p>
    Para empezar, selecciona tu rol y descubre la información que mejor se
    adapta a ti
  </p>

  <div class="category_buttons">
    <button
      matButton="filled"
      class="role_button"
      (click)="handleParent('Alumnos')"
    >
      Soy Alumno
    </button>
    <button
      matButton="filled"
      class="role_button"
      (click)="handleParent('Profesores')"
    >
      Soy Profesor
    </button>
    <button
      matButton="filled"
      class="role_button"
      (click)="handleParent('Administración')"
    >
      Soy Administrador
    </button>
  </div>
</section>

<app-support-box/>
