<mat-toolbar color="primary">
  <span>Mis Temas Personalizados en Material</span>
  <span class="spacer"></span>
  <button mat-icon-button [matMenuTriggerFor]="themeMenu">
    <mat-icon>format_paint</mat-icon>
  </button>
  <mat-menu #themeMenu="matMenu">
    <button mat-menu-item (click)="setTheme('redif-light-theme')">
      Redif Light
    </button>
    <button mat-menu-item (click)="setTheme('redif-dark-theme')">
      Redif Dark
    </button>
  </mat-menu>
</mat-toolbar>

<div class="content-wrapper">
  <mat-card class="component-showcase-card">
    <mat-card-header>
      <mat-card-title [ngClass]="{'white-text': isDarkTheme}">Muestra de Componentes</mat-card-title>
      <mat-card-subtitle>Cambian Segun el Tema Seleccionado</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <div class="container">
        <section class="component-section">
          <h2 [ngClass]="{'white-text': isDarkTheme}">Botones</h2>
          <button mat-button>Básico</button>
          <button mat-raised-button color="primary">Primario Elevado</button>
          <button mat-flat-button color="accent">Acento Plano</button>
          <button mat-fab color="primary" aria-label="Botón FAB primario">
            <mat-icon>favorite</mat-icon>
          </button>
          <button
            mat-mini-fab
            color="accent"
            aria-label="Botón mini FAB de acento"
          >
            <mat-icon>share</mat-icon>
          </button>
        </section>
        <section class="component-section">
          <h2 [ngClass]="{'white-text': isDarkTheme}">Controles de Selección</h2>
          <div>
            <mat-checkbox color="primary">Checkbox Primario</mat-checkbox>
          </div>
          <div>
            <mat-checkbox color="accent" [checked]="true"
              >Checkbox Acento (Marcado)</mat-checkbox
            >
          </div>
          <div>
            <mat-radio-group aria-label="Selecciona una opción" color="primary">
              <mat-radio-button value="1">Opción Radio 1</mat-radio-button>
              <mat-radio-button value="2">Opción Radio 2</mat-radio-button>
            </mat-radio-group>
          </div>
          <div>
            <mat-slide-toggle color="accent" style="margin-top: 15px; margin-left: 10px;"
              >Slide Toggle Acento</mat-slide-toggle
            >
          </div>
        </section>
        <section class="component-section">
          <h2 [ngClass]="{'white-text': isDarkTheme}">Indicadores y Campos</h2>
          <mat-form-field appearance="fill" color="primary">
            <mat-label>Campo de Texto Primario</mat-label>
            <input matInput placeholder="Escribe algo..." />
          </mat-form-field>
        </section>
      </div>
    </mat-card-content>
  </mat-card>
</div>

<router-outlet />
