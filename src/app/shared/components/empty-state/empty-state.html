<mat-card>
  <mat-card-content class="empty-state-content">
    <mat-icon class="empty-state-icon">{{ icon }}</mat-icon>
    @if (title) {
      <h2 class="empty-state-title">{{ title }}</h2>
    }
    @if (message) {
      <p class="empty-state-message">{{ message }}</p>
    }
    @if (action) {
      <button mat-raised-button color="primary" [routerLink]="action.route">
        {{ action.label }}
      </button>
    }
  </mat-card-content>
</mat-card>
