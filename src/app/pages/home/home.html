<div style="display: flex; flex-direction: column; align-items: center;">

<app-page-header [showBackButton]="false" title="¿Qué estás buscando?" />

<app-search-bar />

</div>

<section class="category-section">
  <p>
    Para empezar, selecciona tu rol y descubre la información que mejor se
    adapta a ti
  </p>

  <div class="category-buttons">
    <button
      matButton="filled"
      class="role-button"
      (click)="handleParent('Alumnos')"
    >
      Soy Alumno
    </button>
    <button
      matButton="filled"
      class="role-button"
      (click)="handleParent('Profesores')"
    >
      Soy Profesor
    </button>
    <button
      matButton="filled"
      class="role-button"
      (click)="handleParent('Administración')"
    >
      Soy Administrador
    </button>
  </div>
</section>

<app-support-box />
