<div class="list-container">
  <mat-list>
    @for (article of results(); track article) {
    <mat-list-item role="link" [routerLink]="'/posts/' + article.id">
      <mat-icon matListItemIcon>article</mat-icon>
      <h3 matListItemTitle>{{ article.title }}</h3>
      <p matListItemLine>
        <span>{{ article.content | pipeMarkdown }}</span>
      </p>
    </mat-list-item>
    <mat-divider></mat-divider>
    }
  </mat-list>
</div>
